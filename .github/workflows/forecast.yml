# BD532 Lab 3.2 — ทำนายราคาปิดล่วงหน้า 7 วันทำการ ทุกเช้าวันทำการก่อนตลาดหุ้นสหรัฐเปิด แล้ว deploy หน้าเว็บ
name: Pre-market forecast

on:
  schedule:
    - cron: "20 7 * * 1-5"            # 07:20 จันทร์–ศุกร์ (ตลาดเปิด 09:30) · ไม่ตั้งที่นาที 00 เพราะคิวงานแน่นที่ต้นชั่วโมง
      timezone: "America/New_York"    # GitHub ปรับเวลาออมแสง (DST) ให้เอง = 19:20 เวลาไทยช่วง พ.ย.–มี.ค., 18:20 ช่วง มี.ค.–พ.ย.
  workflow_dispatch:                  # ปุ่ม "Run workflow" สำหรับรันเองทันที

permissions:
  contents: write                     # commit docs/data กลับเข้า repo
  pages: write                        # deploy GitHub Pages
  id-token: write

concurrency:                          # ไม่ให้สองรอบรันซ้อนกัน (เช่น กดรันเองตอนที่ตั้งเวลาไว้กำลังทำงาน)
  group: forecast
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: When did this run start?
        run: |
          echo "trigger=${{ github.event_name }} schedule='${{ github.event.schedule }}'"
          echo "UTC: $(date -u '+%F %T') | New York: $(TZ=America/New_York date '+%F %T') | Bangkok: $(TZ=Asia/Bangkok date '+%F %T')"

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"      # ให้ตรงกับ versions.python ใน models/model_metadata.json
          cache: pip

      - name: Install pinned requirements
        run: pip install -r requirements.txt

      - name: Check artifacts (version, training/serving skew, data checks)
        run: python check_artifacts.py

      - name: Predict
        run: python predict.py

      - name: Commit prediction log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "ไม่มีอะไรเปลี่ยน"
          else
            git commit -m "forecast: $(TZ=America/New_York date +%F)"
            git pull --rebase
            git push
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: predict
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5